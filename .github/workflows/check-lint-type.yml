name: Lint & Type (biome, tsc)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  # Triggers: PR opened, updated (new commits), or reopened
  # 1. Runs on remote GitHub Actions server (fresh environment, not your machine)
  # 2. Required to pass before PR can be merged to main (enforced by branch ruleset)
  pull_request:
    branches: [main]

jobs:
  lint-type:
    name: Run Lint & Type Checks
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint & format check
        run: npx @biomejs/biome ci --error-on-warnings

      - name: Run TypeScript type check
        run: npx tsc --noEmit --pretty
