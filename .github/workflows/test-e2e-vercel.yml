# E2E Tests against Vercel Deployments
#
# Vercel starts this workflow after each successful deployment. Playwright
# tests the live deployment, then the result is posted to the deployed commit:
#   - Preview (push to a non-main branch): "Run E2E Tests on Preview"
#     A required check in the branch ruleset, so a failure blocks the merge.
#   - Production (merge to main): "Run E2E Tests on Production"
#     Can't block anything, because the site is already live.
#
# GitHub runs this file from main, so edits take effect only after merging.
#
# Reference:
# https://vercel.com/kb/guide/how-can-i-run-end-to-end-tests-after-my-vercel-preview-deployment

name: E2E Tests (Vercel)
run-name: E2E Tests (Vercel ${{ github.event.client_payload.environment == 'production' && 'Production' || 'Preview' }}) · ${{ github.event.client_payload.git.ref }}

permissions:
  contents: read
  statuses: write

on:
  repository_dispatch:
    types:
      - "vercel.deployment.success"

# "Production" if Vercel sends environment "production", otherwise "Preview".
# run-name and the job name can't read env, so they repeat this expression.
env:
  DEPLOY_ENV: ${{ github.event.client_payload.environment == 'production' && 'Production' || 'Preview' }}

# A newer deployment of the same branch cancels the older run.
# Keyed on git.ref, not the deployment URL, which is unique per deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.git.ref }}
  cancel-in-progress: true

jobs:
  e2e-vercel:
    name: Run E2E Tests on ${{ github.event.client_payload.environment == 'production' && 'Production' || 'Preview' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      # The deployed commit, not main (the default for repository_dispatch)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.git.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium webkit --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          # Playwright tests this URL instead of starting a local server
          BASE_URL: ${{ github.event.client_payload.url }}
          # Gets Playwright past Vercel Deployment Protection. See:
          # https://vercel.com/docs/deployment-protection/methods-to-bypass-deployment-protection/protection-bypass-automation
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-vercel
          path: .playwright/playwright-report/
          retention-days: 30

      # The run is tied to main, so post the result to the deployed commit.
      # The Preview context must match the ruleset's required check name.
      - name: Report status to commit
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const deployEnv = process.env.DEPLOY_ENV;
            const state = '${{ job.status }}' === 'cancelled' ? 'error' : '${{ job.status }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.client_payload.git.sha }}',
              state: state,
              context: `Run E2E Tests on ${deployEnv}`,
              description: `E2E tests against Vercel ${deployEnv.toLowerCase()}`,
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });
