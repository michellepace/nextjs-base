name: E2E Tests (playwright)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  # Triggers: PR opened, updated (new commits), or reopened
  # 1. Runs on remote GitHub Actions server (fresh environment, not your machine)
  # 2. Required to pass before PR can be merged to main (enforced by branch ruleset)
  #
  # Note: This workflow tests against localhost (built from source).
  # For E2E tests against Vercel deployments, see: test-e2e-vercel.yml
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Run E2E Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium webkit --with-deps

      # playwright.config.ts serves this build with `npm start` when CI is set
      - name: Build Next.js production
        run: npx next build

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: .playwright/playwright-report/
          retention-days: 30
