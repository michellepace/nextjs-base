# Majors open as separate PRs. Security updates ignore the schedule and
# open as soon as a vulnerability is found.
# Docs: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    ignore:
      # Pin @types/node to the Node line in .nvmrc — newer types type-check
      # against APIs the runtime lacks. Raise .nvmrc, engines and this together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Hold TypeScript at 6 — 7 ships no tsserver, so editor plugins (Next.js,
      # typescript-lsp) can't load. Revisit when TypeScript 7 supports plugins.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
