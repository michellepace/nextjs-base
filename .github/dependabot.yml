# Dependabot: Automated updates
# - npm:
#     Version-updates: Weekly on Sundays, minor/patch grouped, major individual
#     Security-updates: Immediate when vulnerabilities detected, grouped
# - GitHub Actions: Keeps workflow action versions current (e.g., actions/checkout)
# Docs: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    ignore:
      # @types/node major versions track Node.js major versions. Keep this on
      # the Node LTS line declared in package.json "engines" (currently 24) —
      # a major bump would type-check against a Node we do not run, letting
      # code call APIs missing at runtime. Raise deliberately at the next LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
