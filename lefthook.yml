glob_matcher: doublestar # ** also matches root files

pre-commit:
  parallel: false # type-check and tests must run on Biome-fixed code

  skip:
    - merge # commits already checked; CI checks the result
    - rebase # commits already checked; CI checks the result

  commands:
    npm-install:
      glob: "package.json"
      run: npm install && git add package-lock.json

    biome-check: # config: biome.json
      run: npx @biomejs/biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    markdown-lint: # config: .markdownlint-cli2.yaml
      glob: "**/*.md"
      run: npx markdownlint-cli2 --fix {staged_files}
      stage_fixed: true

    type-check: # config: tsconfig.json
      run: npx tsc --noEmit --pretty

    unit-tests: # config: vitest.config.ts
      glob:
        - "**/*.{ts,tsx}"
        - "package-lock.json"
      exclude: "e2e/**/*" # E2E tests run on push
      run: npx vitest run

pre-push:
  parallel: false # build holds a lock; Playwright must wait

  commands:
    build: # catches static generation errors (e.g. missing Suspense)
      run: npm run build

    playwright-tests: # config: playwright.config.ts
      glob:
        - "**/*.{ts,tsx,css}"
        - "package-lock.json"
        - "postcss.config.mjs"
      exclude: "**/*.test.{ts,tsx}" # unit tests run on commit
      run: npx playwright test
